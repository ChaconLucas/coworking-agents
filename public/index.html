<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coworking-agents</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="hud">
  <div class="brand">
    <img class="logo" src="logo.svg" alt="" width="32" height="32">
    <div><b>coworking<span>·</span>agents</b><small id="host"></small></div>
  </div>
  <div class="counts" id="counts"></div>
  </div>
  <div class="tools">
    <button id="btn-notify" class="icon-btn" aria-pressed="false"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M7 1h2v1h2v1h1v5h1v2h1v2H2v-2h1V8h1V3h1V2h2zM6 13h4v1H9v1H7v-1H6z"/></svg><span class="sr"></span></button>
    <button id="btn-sound" class="icon-btn" aria-pressed="false"><svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M2 6h3l4-4h1v12H9l-4-4H2zM12 5h1v1h1v4h-1v1h-1V5z"/></svg><span class="sr"></span></button>
    <button id="btn-lang" class="icon-btn lang"></button>
  </div>
</header>
<div id="clashes" class="clashes" hidden></div>
<main id="stage">
  <div id="office">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>
  </div>
  <p id="empty" class="empty" hidden></p>
</main>
<aside id="panel" class="panel" hidden aria-live="polite">
  <button id="panel-close" class="close" aria-label="×">×</button>
  <div id="panel-body"></div>
</aside>
<div id="offline" class="offline" hidden></div>
<script src="art.js"></script>
<script src="js/i18n.js"></script>
<script src="js/palette.js"></script>
<script src="js/floorplan.js"></script>
<script src="js/building.js"></script>
<script src="js/actors.js"></script>
<script src="js/scene.js"></script>
<script src="js/overlay.js"></script>
<script src="js/panel.js"></script>
<script src="js/help.js"></script>
<script src="js/talk.js"></script>
<script src="js/topbar.js"></script>
<script src="js/main.js"></script>
</body>
</html>
