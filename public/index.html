<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coworks-agents</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23d97757'/><rect x='4' y='5' width='2' height='2' fill='%23fff'/><rect x='10' y='5' width='2' height='2' fill='%23fff'/><rect x='5' y='10' width='6' height='2' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand"><span class="logo"></span><b>coworks-agents</b><span class="host" id="host"></span></div>
  <div class="counts" id="counts"></div>
  <div class="tools">
    <button id="btn-notify" class="chip" aria-pressed="false"></button>
    <button id="btn-sound" class="chip" aria-pressed="false"></button>
    <button id="btn-lang" class="chip"></button>
  </div>
</header>
<div id="clashes" class="clashes" hidden></div>
<main id="stage">
  <div id="office">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>
  </div>
  <p id="empty" class="empty" hidden></p>
</main>
<aside id="panel" class="panel" hidden aria-live="polite">
  <button id="panel-close" class="close" aria-label="×">×</button>
  <div id="panel-body"></div>
</aside>
<div id="offline" class="offline" hidden></div>
<script src="app.js"></script>
</body>
</html>
