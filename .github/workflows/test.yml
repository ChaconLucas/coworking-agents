name: test

on:
  push:
  pull_request:

jobs:
  # the full suite needs ps, sleep and /bin/sh: macOS and Linux
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm test
      - run: node bin/coworking-agents.js --json > snapshot.json && node -e "const s=require('./snapshot.json'); if(!Array.isArray(s.people)) process.exit(1); console.log(s.platform, s.people.length, 'people')"

  # Windows: no full suite yet, but the real code paths run (PowerShell process table, snapshot, server)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node bin/coworking-agents.js --help
      - run: node bin/coworking-agents.js --json > snapshot.json
      - run: node -e "const s=JSON.parse(require('fs').readFileSync('snapshot.json','utf8')); if(s.platform!=='win32'||!Array.isArray(s.people)) process.exit(1); console.log(s.platform, s.people.length, 'people')"
      - run: node -e "const {processList}=require('./src/proc'); const r=processList(); if(r.length<5||!r.some(p=>/node/i.test(p.cmd))) { console.log(r.slice(0,5)); process.exit(1); } console.log(r.length, 'processes')"
      - run: node -e "require('./src/server').start({port:0}).then(async hq=>{const r=await fetch(hq.base+'/api/state',{headers:{Cookie:'cw='+hq.token}}); const j=await r.json(); hq.close(); if(r.status!==200||!Array.isArray(j.people)) process.exit(1); console.log('server ok')})"
